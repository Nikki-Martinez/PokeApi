<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>PokeApi</title>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">POKÉDEX</div>
        <p style="color: white; font-size: 1.1rem;">
          Explora el mundo Pokémon con filtros avanzados
        </p>
      </header>

      <div class="controls-container">
        <div class="search-container">
          <input
            type="text"
            id="searchInput"
            placeholder="🔍 Buscar Pokémon por nombre o número..."
          />
          <button class="btn" id="searchButton">Buscar</button>
          <button class="btn" id="randomButton">🎲 Aleatorio</button>
          <button class="btn" id="clearFilters">🔄 Limpiar</button>
        </div>

        <div class="filter-container">
          <div class="filter-group">
            <label for="typeFilter">🏷️ Tipo:</label>
            <select id="typeFilter">
              <option value="">Todos los tipos</option>
            </select>
          </div>

          <div class="filter-group pagination-controls">
            <label for="itemsPerPage">📄 Por página:</label>
            <select id="itemsPerPage">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>
      </div>

      <div id="pokemonGrid" class="pokedex-grid"></div>

      <div class="pagination">
        <button id="prevButton">⬅ Anterior</button>
        <span class="page-info" id="pageInfo">Página 1 de 1</span>
        <button id="nextButton">Siguiente ➡</button>
      </div>

      <div id="loading" class="loading" style="display: none;">
        ⚡ Cargando Pokémon...
      </div>
      <div id="errorMessage" class="error-message" style="display: none;"></div>
    </div>

    <div id="overlay" class="overlay" style="display: none;"></div>
    <div id="pokemonDetail" class="pokemon-detail" style="display: none;"></div>

    <script src="./script.js"></script>
  </body>
</html>
